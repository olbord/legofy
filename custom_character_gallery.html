<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Character Gallery</title>
<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
        }
        .preview {
            width: 200px;
            height: 300px;
            border: 2px solid #ccc;
            margin-bottom: 20px;
            background-color: white;
            position: relative;
        }
        .preview img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #bottomImage { z-index: 1; }
        #topImage { z-index: 2; }
        #faceImage { z-index: 3; }
        #hairImage { z-index: 4; }
        select {
            margin: 10px;
            padding: 5px;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="preview" id="preview">
            <img id="hairImage" src="" alt="" />
            <img id="faceImage" src="" alt="" />
            <img id="topImage" src="" alt="" />
            <img id="bottomImage" src="" alt="" />
        </div>
        <label for="hair">Hair</label>
        <select id="hair" onchange="updatePreview('hair')">
            <option value="">Select Hair</option>
            <option value="blackMedium">Female Black Short Hair</option>
            <option value="blackShort">Female Black Medium Hair</option>
            <option value="blondeLong">Female Blonde Long Hair</option>
            <option value="blondeShort">Female Blonde Short Hair</option>
            <option value="brownBun">Female Brown Bun Hair</option>
            <option value="brownLong">Female Brown Long Hair</option>
            <option value="blackWavy">Male Black Wavy Hair</option>
            <option value="maleBlondeShort">Male Blonde Short Hair</option>
            <option value="brownSpiky">Male Brown Spiky Hair</option>
            <option value="brownStraight">Male Brown Straight Hair</option>
            <option value="brownStyled">Male Brown Styled Hair</option>
            <option value="brownWavy">Male Brown Wavy Hair</option>
        </select>
        <label for="face">Face</label>
        <select id="face" onchange="updatePreview('face')">
            <option value="">Select Face</option>
            <option value="femaleSmirk">Female Smirk</option>
            <option value="maleSmileSunglasses">Male Smile With Sunglasses</option>
            <option value="femaleSmileFreckles">Female Smile With Freckles</option>
            <option value="femaleSmirkSunglasses">Female Smirk With Sunglasses</option>
            <option value="maleOldSmileBeard">Male Old Smile With Beard</option>
            <option value="maleThoughtful">Male Thoughtful Face</option>
            <option value="femaleSimper">Female Simper</option>
            <option value="maleAngry">Male Angry Face</option>
            <option value="femaleNeutral">Female Neutral Face</option>
            <option value="maleSmileBeard">Male Smile With Beard</option>
            <option value="maleSmileFreckles">Male Smile With Freckles</option>
        </select>
        <label for="top">Top</label>
        <select id="top" onchange="updatePreview('top')">
            <option value="">Select Top</option>
            <option value="beigeHawaii">Hawaii Shirt</option>
            <option value="blueSuit">Blue Blazer</option>
            <option value="blueSweater">Blue Sweater</option>
            <option value="brownJacket">Brown Jacket</option>
            <option value="brownSweater">Brown Sweater</option>
            <option value="greenCasual">Green Jacket</option>
            <option value="greenCozy">Green Sweater</option>
            <option value="greyCasual">Grey Zipper</option>
            <option value="lightGreen">Light Green Shirt</option>
            <option value="redBoy">Red Shirt</option>
            <option value="redGirl">Red Cardigan</option>
            <option value="whiteColorful">Tie Dye Sweater</option>
        </select>
        <label for="bottom">Bottom</label>
        <select id="bottom" onchange="updatePreview('bottom')">
            <option value="">Select Bottom</option>
            <option value="whitePants">White Pants</option>
            <option value="blackSkirt">Black Skirt</option>
            <option value="piratePants">Pirate Pants</option>
            <option value="blackPants">Black Pants</option>
            <option value="lightBluePants">Light Blue Pants</option>
            <option value="bluePants">Blue Pants</option>
            <option value="whiteJeans">White Jeans</option>
            <option value="beigePants">Beige Pants</option>
            <option value="redPants">Red Pants</option>
            <option value="beigeJeans">Beige Jeans</option>
            <option value="yellowPants">Yellow Pants</option>
            <option value="whiteSkirt">White Skirt</option>

        </select>
    </div>
    <script>
        const imagePaths = {
            hair: {
                blackMedium: "legoParts/hair/female/blackMedium.png",
                blackShort: "legoParts/hair/female/blackShort.png",
                blondeLong: "legoParts/hair/female/blondeLong.png",
                blondeShort: "legoParts/hair/female/blondeShort.png",
                brownBun: "legoParts/hair/female/brownBun.png",
                brownLong: "legoParts/hair/female/brownLong.png",
                blackWavy: "legoParts/hair/male/blackWavy.png",
                maleBlondeShort: "legoParts/hair/male/blondeShort.png",
                brownSpiky: "legoParts/hair/male/brownSpiky.png",
                brownStraight: "legoParts/hair/male/brownStraight.png",
                brownStyled: "legoParts/hair/male/brownStyled.png",
                brownWavy: "legoParts/hair/male/brownWavy.png" ,
            },
            face: {
                femaleSmirk: "legoParts/face/1face.png",
                maleSmileSunglasses: "legoParts/face/2face.png",
                femaleSmileFreckles: "legoParts/face/3face.png",
                femaleSmirkSunglasses: "legoParts/face/4face.png",
                maleOldSmileBeard: "legoParts/face/5face.png",
                maleThoughtful: "legoParts/face/6face.png",
                femaleSimper: "legoParts/face/7face.png",
                maleAngry: "legoParts/face/8face.png",
                femaleNeutral: "legoParts/face/9face.png",
                maleSmileBeard: "legoParts/face/10face.png",
                maleSmileFreckles: "legoParts/face/11face.png",
            },
            top: {
                beigeHawaii: "legoParts/top/beigeHawaii.png",
                blueSuit: "legoParts/top/blueSuit.png",
                blueSweater: "legoParts/top/blueSweater.png",
                brownJacket: "legoParts/top/brownJacket.png",
                brownSweater: "legoParts/top/brownSweater.png",
                greenCasual: "legoParts/top/greenCasual.png",
                greenCozy: "legoParts/top/greenCozy.png",
                greyCasual: "legoParts/top/greyCasual.png",
                lightGreen: "legoParts/top/lightGreen.png",
                redBoy: "legoParts/top/redBoy.png",
                redGirl: "legoParts/top/redGirl.png",
                whiteColorful: "legoParts/top/whiteColorful.png",
            },
            bottom: {
                whitePants: "legoParts/bottom/1pants.png",
                blackSkirt: "legoParts/bottom/2pants.png",
                piratePants: "legoParts/bottom/3pants.png",
                blackPants: "legoParts/bottom/4pants.png",
                lightBluePants: "legoParts/bottom/5pants.png",
                bluePants: "legoParts/bottom/6pants.png",
                whiteJeans: "legoParts/bottom/7pants.png",
                beigePants: "legoParts/bottom/8pants.png",
                redPants: "legoParts/bottom/9pants.png",
                beigeJeans: "legoParts/bottom/10pants.png",
                yellowPants: "legoParts/bottom/11pants.png",
                whiteSkirt: "legoParts/bottom/12pants.png",
            }
        };

        function updatePreview(type) {
            const selectedValue = document.getElementById(type).value;
            const imageElement = document.getElementById(`${type}Image`);

            if (selectedValue) {
                imageElement.src = imagePaths[type][selectedValue];
                imageElement.alt = `${type} - ${selectedValue}`;
            } else {
                imageElement.src = "";
                imageElement.alt = "";
            }
        }
    </script>
</body>
</html>
