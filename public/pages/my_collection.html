<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../styles/my_collection.css"/>
    <title>My Collection</title>
</head>
<body>

<div id="navbar">
    <ul>
        <li><a class="nav-bar" href="index.html"> Home </a></li>
        <li id="signout_button" style="float: right; display: none"><a class="nav-bar"> Log out </a></li>
        <li id="signin_link" style="float: right"><a class="nav-bar" href="Log%20in.html"> Log in </a></li>
        <li style="float: right"><a class="nav-bar" href="my_collection.html"> My Collection </a></li>
        <li style="float: right"><a class="nav-bar" href="About%20Us.html"> About Us </a></li>
    </ul>
</div>

<p id="title_collection">
    My Collection
</p>

<div class="row" id="collectionContainer">

</div>

<script>
    function loadCollection() {
        const container = document.getElementById('collectionContainer');
        const savedCharacters = JSON.parse(localStorage.getItem('characters')) || [];

        if (savedCharacters.length === 0) {
            container.innerHTML = "<p>No characters in your collection yet!</p>";
            return;
        }

        savedCharacters.forEach(character => {
            const card = document.createElement('div');
            card.classList.add('card');

            const characterImage = document.createElement('div');
            characterImage.classList.add('character-preview');
            characterImage.style.position = 'relative';
            characterImage.style.width = '100px';
            characterImage.style.height = '150px';

            ['bottom', 'top', 'face', 'hair'].forEach(layer => {
                if (character.options[layer]) {
                    const img = document.createElement('img');
                    img.src = character.options[layer].src;
                    img.style.position = 'absolute';
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'contain';
                    characterImage.appendChild(img);
                }
            });

            const name = document.createElement('p');
            name.style.alignSelf = 'center';
            name.textContent = character.name;

            card.appendChild(characterImage);
            card.appendChild(name);
            container.appendChild(card);
        });
    }

    loadCollection();
</script>
</body>
</html>
